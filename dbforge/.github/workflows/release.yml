name: Release

# A release is a consequence of merging to main, not a separate ritual: bump
# VERSION in the pull request and merging it publishes that version. Merges
# that do not touch VERSION release nothing, so ordinary work does not produce
# a stream of releases nobody asked for.
#
# Pushing a v* tag by hand still releases, for the case where a release has to
# be cut from something other than the tip of main.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.6.0. Defaults to the VERSION file.'
        required: false
        type: string

permissions:
  contents: write   # create the tag and the release

jobs:
  # Works out what, if anything, is being released. Everything downstream is
  # conditional on this, so a merge that changes no version costs one short job.
  decide:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          case "${GITHUB_REF}" in
            refs/tags/v*)
              # Tag pushed by hand: it is the version, and it already exists.
              version="${GITHUB_REF#refs/tags/v}"
              ;;
            *)
              version="${INPUT_VERSION:-$(tr -d '[:space:]' < VERSION)}"
              ;;
          esac
          tag="v${version}"

          if [ -z "$version" ]; then
            echo "no version to release"; exit 1
          fi

          # An existing tag means this version is already out. Re-releasing it
          # would either fail or silently replace artefacts people already have.
          if [ "${GITHUB_REF}" != "refs/tags/${tag}" ] && git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} already exists; nothing to release. Bump VERSION to cut a new one."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::releasing ${tag}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  # The gate. A commit that would not pass a pull request has no business
  # becoming a release.
  verify:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: make vet
      - run: make test
      - run: make hook-test

  # Tagging happens after verification and before building, so every artefact
  # -- binaries, tarball, and the Arch package's own pkgver -- describes the
  # released version rather than an untagged commit.
  #
  # If a later job fails, the tag exists without a release. Delete it and push
  # again; that is a better failure than a release whose contents claim to be
  # something else.
  tag:
    needs: [decide, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Create the tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG"
          # Tags pushed with the default token do not re-trigger workflows, so
          # this cannot loop back into this same run.
          git push origin "$TAG"

  build:
    needs: [decide, tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build binaries and the source tarball
        run: |
          make build
          make dist-tarball

      - name: Confirm the binaries report the released version
        env:
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(./dist/dbforge --version)"
          echo "$version"
          # A release whose binary reports "dev" is worse than no release: every
          # bug report from it is unattributable. "-dirty" means the tree had
          # uncommitted changes, so the tag does not describe what was built.
          case "$version" in
            *dev*)   echo "binary was not stamped with the tag"; exit 1 ;;
            *dirty*) echo "built from a dirty tree; the tag does not describe it"; exit 1 ;;
          esac
          case "$version" in
            *"$TAG"*) ;;
            *) echo "binary reports '$version', expected to contain '$TAG'"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error

  # Reuses the same job that gates pull requests, so a release is never the
  # first time the packaging is exercised.
  package:
    needs: [decide, tag]
    uses: ./.github/workflows/arch-package.yml
    with:
      ref: ${{ needs.decide.outputs.tag }}

  release:
    needs: [decide, build, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: dist/

      # Generated here rather than in the build job so the file covers every
      # artefact actually being published, the Arch package included.
      - name: Checksum the artefacts
        run: |
          cd dist
          sha256sum dbforge dbforge-tui *.tar.gz *.pkg.tar.* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --notes-file - \
            dist/dbforge dist/dbforge-tui dist/*.tar.gz dist/*.pkg.tar.* dist/SHA256SUMS <<'NOTES'
          ## Install

          Arch, from the package attached to this release:

              sudo pacman -U dbforge-git-*.pkg.tar.zst

          Or build it from the checkout:

              packaging/aur/check.sh --install

          From source:

              make install && ./packaging/install.sh

          Then, once:

              systemctl --user enable --now podman.socket
              sudo loginctl enable-linger "$USER"

          Run `dbctl doctor` if anything does not work; it checks the rootless
          setup end to end and tells you what to fix.

          ## Your data

          Instance data lives in `~/.local/share/dbforge` and is never touched
          by installing, upgrading or removing DBForge.
          NOTES
