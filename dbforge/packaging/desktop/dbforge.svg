<?xml version="1.0" encoding="UTF-8"?>
<!-- DBForge: a database cylinder struck like an anvil. Drawn with currentColor
     where a theme allows it and a fixed accent otherwise, so it reads on both
     light and dark panels. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8ef7"/>
      <stop offset="1" stop-color="#2d5fbe"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#body)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="32" cy="16" rx="18" ry="7"/>
    <path d="M14 16v14c0 3.9 8.1 7 18 7s18-3.1 18-7V16"/>
    <path d="M14 30v14c0 3.9 8.1 7 18 7s18-3.1 18-7V30"/>
  </g>
  <path d="M35 24l-8 12h6l-3 10 10-14h-6z" fill="#f7b84f" stroke="#f7b84f"
        stroke-width="2" stroke-linejoin="round"/>
</svg>
