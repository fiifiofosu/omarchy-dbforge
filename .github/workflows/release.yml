name: Release

# A release is a consequence of merging to main, not a separate ritual, and
# nobody has to remember to bump anything. Every push to main that changes
# shipped files releases the next version, worked out from the latest v* tag:
#
#   patch  by default
#   minor  if a commit since the last tag has a "Bump: minor" trailer line
#   major  if one has "Bump: major" or a "BREAKING CHANGE:" trailer line
#
# Trailers must start their own line; a mention inside a sentence is ignored.
#
# Pushes that touch only documentation (*.md, docs/, .github/) release nothing.
# Setting dbforge/VERSION by hand to an unreleased version still wins, as does
# the version input of a manual run.
#
# The bump itself is a "Release vX.Y.Z" commit made by this workflow after the
# checks pass, pushed to main together with its tag. Pushes made with the
# default token do not trigger workflows, so that commit cannot start another
# release.
#
# Pushing a v* tag by hand still releases, for the case where a release has to
# be cut from something other than the tip of main.
#
# One version covers both halves of the repository: dbforge/VERSION is the
# source of truth and manifest.json must agree, which `make version` enforces.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.9.0. Defaults to dbforge/VERSION.'
        required: false
        type: string

permissions:
  contents: write   # commit the version, create the tag and the release

# Two pushes in quick succession would otherwise both compute the same next
# version. Queued, the second sees the first's tag and moves past it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Works out what, if anything, is being released. Everything downstream is
  # conditional on this, so a merge that changes no version costs one short job.
  decide:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      bump: ${{ steps.decide.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          current=$(tr -d '[:space:]' < dbforge/VERSION)
          release=true

          case "${GITHUB_REF}" in
            refs/tags/v*)
              # Tag pushed by hand: it is the version, and it already exists.
              version="${GITHUB_REF#refs/tags/v}"
              ;;
            *)
              if [ -n "${INPUT_VERSION}" ]; then
                version="${INPUT_VERSION}"
              elif ! git rev-parse -q --verify "refs/tags/v${current}" >/dev/null; then
                # Someone set the version by hand to one not yet released.
                version="${current}"
              else
                last="v${current}"
                # Only shipped files earn a release; a typo fix in a README
                # should not put a new version in front of every user.
                shipped=$(git diff --name-only "${last}" HEAD |
                  grep -vE '\.md$|(^|/)docs/|^\.github/' || true)
                if [ -z "$shipped" ]; then
                  release=false
                  version="${current}"
                  echo "::notice::nothing shipped has changed since ${last}; nothing to release."
                else
                  log=$(git log --format=%B "${last}..HEAD")
                  IFS=. read -r major minor patch <<<"${current}"
                  # Whole-line trailers only. A marker matched anywhere in the
                  # text fires on a commit that merely describes these rules,
                  # which is how v1.0.0 was once released by accident.
                  if grep -qE '^(Bump: major|BREAKING[ -]CHANGE:)' <<<"$log"; then
                    version="$((major + 1)).0.0"
                  elif grep -qE '^Bump: minor[[:space:]]*$' <<<"$log"; then
                    version="${major}.$((minor + 1)).0"
                  else
                    version="${major}.${minor}.$((patch + 1))"
                  fi
                fi
              fi
              ;;
          esac
          tag="v${version}"

          if ! grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"$version"; then
            echo "version '${version}' is not MAJOR.MINOR.PATCH"; exit 1
          fi

          # An existing tag means this version is already out. Re-releasing it
          # would either fail or silently replace artefacts people already have.
          if [ "$release" = true ] && [ "${GITHUB_REF}" != "refs/tags/${tag}" ] &&
             git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            release=false
            echo "::notice::${tag} already exists; nothing to release."
          fi
          [ "$release" = true ] && echo "::notice::releasing ${tag}"

          # The files are rewritten only when they do not already say it; a
          # hand-set version or a pushed tag needs no commit.
          bump=false
          [ "$release" = true ] && [ "$version" != "$current" ] && bump=true

          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "bump=${bump}" >> "$GITHUB_OUTPUT"

  # The gate. A commit that would not pass a pull request has no business
  # becoming a release. Both halves are checked: a release that ships a widget
  # whose manifest disagrees with the binaries is worse than no release.
  verify:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: dbforge/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Versions agree across the repository
        run: |
          set -euo pipefail
          manifest=$(jq -r '.version' manifest.json)
          daemon=$(tr -d '[:space:]' < dbforge/VERSION)
          released='${{ needs.decide.outputs.version }}'
          [ "$manifest" = "$daemon" ] ||
            { echo "manifest.json says $manifest, dbforge/VERSION says $daemon"; exit 1; }
          # When the tag job is about to write the version, the files still
          # say the previous one; that is expected, not drift.
          if [ '${{ needs.decide.outputs.bump }}' != true ]; then
            [ "$manifest" = "$released" ] ||
              { echo "releasing $released but the repository says $manifest"; exit 1; }
          fi
          echo "version $released"
      - run: node model_test.mjs
      - run: make -C dbforge vet
      - run: make -C dbforge test
      - run: make -C dbforge hook-test

  # Tagging happens after verification and before building, so every artefact
  # -- binaries, tarball, and the Arch package's own pkgver -- describes the
  # released version rather than an untagged commit.
  #
  # If a later job fails, the tag (and its release commit) exists without a
  # release. Delete the tag and re-run; that is a better failure than a release
  # whose contents claim to be something else.
  tag:
    needs: [decide, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Commit the version and create the tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          TAG: ${{ needs.decide.outputs.tag }}
          VERSION: ${{ needs.decide.outputs.version }}
          BUMP: ${{ needs.decide.outputs.bump }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          refs=("refs/tags/$TAG")
          if [ "$BUMP" = true ]; then
            printf '%s\n' "$VERSION" > dbforge/VERSION
            jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.json.new
            mv manifest.json.new manifest.json
            git commit -q -am "Release $TAG"
            # Onto the commit that was verified. If main has moved on since,
            # this push is refused rather than releasing something unchecked;
            # the newer push runs its own release.
            refs+=("HEAD:refs/heads/main")
          fi

          git tag -a "$TAG" -m "$TAG"
          # Both or neither: a tag on a commit main never received, or a
          # version commit with no tag, would each leave the next run confused.
          # Pushes made with the default token do not trigger workflows, so
          # this cannot loop back into a new run.
          git push --atomic origin "${refs[@]}"

  build:
    needs: [decide, tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: dbforge/go.sum

      - name: Build binaries and the source tarball
        run: |
          make -C dbforge build
          make -C dbforge dist-tarball

      - name: Confirm the binaries report the released version
        env:
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(./dbforge/dist/dbforge --version)"
          echo "$version"
          # A release whose binary reports "dev" is worse than no release: every
          # bug report from it is unattributable. "-dirty" means the tree had
          # uncommitted changes, so the tag does not describe what was built.
          case "$version" in
            *dev*)   echo "binary was not stamped with the tag"; exit 1 ;;
            *dirty*) echo "built from a dirty tree; the tag does not describe it"; exit 1 ;;
          esac
          case "$version" in
            *"$TAG"*) ;;
            *) echo "binary reports '$version', expected to contain '$TAG'"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dbforge/dist/
          if-no-files-found: error

  # Reuses the same job that gates pull requests, so a release is never the
  # first time the packaging is exercised.
  package:
    needs: [decide, tag]
    uses: ./.github/workflows/arch-package.yml
    with:
      ref: ${{ needs.decide.outputs.tag }}

  release:
    needs: [decide, build, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: dist/

      # Generated here rather than in the build job so the file covers every
      # artefact actually being published, the Arch package included.
      - name: Checksum the artefacts
        run: |
          cd dist
          sha256sum dbforge dbforge-tui *.tar.gz *.pkg.tar.* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --notes-file - \
            dist/dbforge dist/dbforge-tui dist/*.tar.gz dist/*.pkg.tar.* dist/SHA256SUMS <<'NOTES'
          This release covers both halves of the repository: the DBForge daemon
          and CLI, and the Omarchy bar widget that drives them.

          ## Install DBForge

          Arch, from the package attached to this release:

              sudo pacman -U dbforge-git-*.pkg.tar.zst

          Or build it from the checkout:

              cd dbforge && packaging/aur/check.sh --install

          From source:

              cd dbforge && make install && ./packaging/install.sh

          That is the whole installation — both paths enable the service and
          turn on user lingering for you, so your databases survive logout.
          There is no follow-up command:

              dbctl create postgres:16 --name app-db

          Run `dbctl doctor` if anything does not work; it checks the rootless
          setup end to end and tells you what to fix.

          ## Install the bar widget

          On Omarchy 4.0 or newer, once DBForge is installed:

              omarchy plugin add https://github.com/fiifiofosu/omarchy-dbforge --enable

          The widget tracks `main` through `omarchy plugin update`, so it is not
          pinned to this tag.

          ## Your data

          Instance data lives in `~/.local/share/dbforge` and is never touched
          by installing, upgrading or removing DBForge.
          NOTES
